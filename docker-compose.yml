services:
  postgres:
    image: postgres:17
    container_name: pulsecheck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pulsecheck
      POSTGRES_USER: pulsecheck
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pulsecheck_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsecheck -d pulsecheck"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pulsecheck_data:
